name: Release Services

on:
  push:
    # branches: [main]
    tags: ["v[0-9]*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      identity-service: ${{ steps.filter.outputs.identity-service }}
      media-service: ${{ steps.filter.outputs.media-service }}
      messaging-service: ${{ steps.filter.outputs.messaging-service }}
      voice-service: ${{ steps.filter.outputs.voice-service }}
      realtime: ${{ steps.filter.outputs.realtime }}
      outbox-worker: ${{ steps.filter.outputs.outbox-worker }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
      livekit-pooler: ${{ steps.filter.outputs.livekit-pooler }}
      nsfw-detector: ${{ steps.filter.outputs.nsfw-detector }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'backend/libs/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
            identity-service:
              - *shared
              - 'backend/services/identity/**'
              - 'docker/identity-service/**'
            media-service:
              - *shared
              - 'backend/services/media/**'
              - 'docker/media-service/**'
            messaging-service:
              - *shared
              - 'backend/services/messaging/**'
              - 'docker/messaging-service/**'
            voice-service:
              - *shared
              - 'backend/services/voice/**'
              - 'docker/voice-service/**'
            realtime:
              - *shared
              - 'backend/services/realtime/**'
              - 'docker/realtime/**'
            outbox-worker:
              - *shared
              - 'backend/workers/outbox-worker/**'
              - 'docker/outbox-worker/**'
            notification-service:
              - *shared
              - 'backend/services/notification/**'
              - 'docker/notification-service/**'
            livekit-pooler:
              - *shared
              - 'backend/services/messaging/core/**'
              - 'backend/services/messaging/domain/**'
              - 'backend/services/messaging/infrastructure/**'
              - 'backend/services/messaging/migrations/**'
              - 'backend/workers/livekit-pooler/**'
              - 'docker/livekit-pooler/**'
            nsfw-detector:
              - 'backend/nsfw-detector/**'
              - 'docker/nsfw-detector/**'
            web:
              - 'frontend/**'
              - 'docker/web/**'

  build-and-push:
    runs-on: ubuntu-latest
    needs: changes
    if: always() && needs.changes.result != 'failure'
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service: [identity-service, media-service, messaging-service, voice-service, realtime, outbox-worker, notification-service, livekit-pooler, nsfw-detector, web]

    steps:
      - name: Decide whether to build
        id: decide
        run: |
          BUILD=false
          case "${{ github.ref }}" in
            refs/tags/v[0-9]*) BUILD=true ;;
            refs/heads/*)
              if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ needs.changes.outputs[matrix.service] }}" = "true" ]; then
                BUILD=true
              fi
              ;;
          esac
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Checkout Code
        if: steps.decide.outputs.build == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.decide.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: steps.decide.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.service }}
        if: steps.decide.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and Push ${{ matrix.service }}
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  promote:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ !cancelled() && needs.build-and-push.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    concurrency:
      group: promote-staging
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Point staging at the released images
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          FILE=deploy/argocd/envs/staging/values.yaml
          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "$GITHUB_REF_NAME is a pre-release or otherwise not X.Y.Z; images are published but staging stays where it is"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            CURRENT="$(sed -n 's/^  tag: "\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "$FILE" | head -n1)"
            if [ -n "$CURRENT" ] && [ "$CURRENT" != "latest" ] && [ "$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]; then
              echo "staging is on $CURRENT, which is newer than $VERSION; leaving it"
              exit 0
            fi
            if [ "$CURRENT" = "$VERSION" ]; then
              echo "staging already on $VERSION"
              exit 0
            fi
            sed -i "s/^  tag: .*/  tag: \"$VERSION\"/" "$FILE"
            git add "$FILE"
            git commit -q -m "chore(deploy): staging on $GITHUB_REF_NAME"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected on attempt $attempt, retrying against the new main"
            sleep $((attempt * 5))
          done
          echo "could not promote $VERSION after 5 attempts" >&2
          exit 1
