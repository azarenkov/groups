name: Release Web

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npx react-scripts build
        env:
          CI: true
          GENERATE_SOURCEMAP: "false"
          REACT_APP_API_URL: /api
          REACT_APP_WS_URL: /ws

      - name: Package
        id: package
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          ARCHIVE="rift-web-$VERSION.tar.gz"
          tar -czf "$ARCHIVE" -C build .
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload to rift-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO: rift-space/rift-releases
          TAG: v${{ steps.package.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/$REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)"
          if [ -z "$release_id" ]; then
            gh release create "$TAG" --repo "$REPO" --draft --title "$TAG" --notes "Rift $TAG"
            release_id="$(gh api "repos/$REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)"
          fi
          for asset in "$ARCHIVE" "$ARCHIVE.sha256"; do
            existing="$(gh api "repos/$REPO/releases/$release_id/assets" --jq ".[] | select(.name == \"$asset\") | .id" | head -n1)"
            if [ -n "$existing" ]; then
              gh api -X DELETE "repos/$REPO/releases/assets/$existing"
            fi
            gh api -X POST -H "Content-Type: application/gzip" \
              "https://uploads.github.com/repos/$REPO/releases/$release_id/assets?name=$asset" \
              --input "$asset" > /dev/null
            echo "uploaded $asset"
          done
