name: Infra

on:
  pull_request:
    paths:
      - "deploy/**"
      - "docker/web/**"
      - "frontend/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      cluster:
        description: "Bring up a kind cluster and run the smoke test"
        type: boolean
        default: false
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            deploy:
              - 'deploy/**'
              - '.github/workflows/infra.yml'
            web:
              - 'frontend/**'
              - 'docker/web/**'
              - '.github/workflows/infra.yml'

  lint:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.deploy == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Helm lint and render
        run: |
          helm lint deploy/helm/rift -f deploy/helm/rift/ci/lint-values.yaml
          helm template rift deploy/helm/rift -f deploy/helm/rift/ci/lint-values.yaml > /tmp/rendered.yaml
          helm template rift deploy/helm/rift -f deploy/helm/rift/ci/lint-values.yaml --set web.enabled=false --set networkPolicy.enabled=false --set autoscaling.enabled=false > /dev/null
          grep -c '^kind:' /tmp/rendered.yaml
          if helm template rift deploy/helm/rift -f deploy/helm/rift/ci/lint-values.yaml --set networkPolicy.ingressController.namespaceSelector=null > /dev/null 2>&1; then
            echo "the chart rendered an allow-all gateway policy without being asked to"; exit 1
          fi

      - name: Smoke script is executable and well-formed
        run: bash -n deploy/scripts/smoke.sh

      - name: Terraform fmt and validate
        run: |
          cd deploy/terraform && terraform fmt -recursive -check
          cd envs/local && terraform init -backend=false -input=false && terraform validate

  web-image:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Web image builds
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/web/Dockerfile
          push: false
          load: true
          tags: rift/web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Web image serves the app with its headers
        run: |
          docker run -d --rm --name web --read-only --tmpfs /tmp -p 8080:8080 -e RIFT_API_URL=https://api.example.test/api rift/web:ci
          for _ in $(seq 1 20); do curl -sf localhost:8080/healthz > /dev/null && break; sleep 1; done
          curl -sf localhost:8080/join/token | grep -q 'src="/static/js/'
          curl -sf localhost:8080/config.js | grep -q 'https://api.example.test/api'
          headers="$(curl -s -o /dev/null -D - localhost:8080/)"
          echo "$headers" | grep -qi '^x-frame-options: DENY'
          docker rm -f web

  cluster:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.cluster)
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bring the local environment up
        working-directory: deploy/terraform/envs/local
        env:
          TF_VAR_image_registry: ghcr.io/rift-space/rift
          TF_VAR_image_tag: latest
          TF_VAR_ghcr_user: ${{ github.actor }}
          TF_VAR_ghcr_token: ${{ secrets.GITHUB_TOKEN }}
          TF_VAR_workers: 1
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve -target=kind_cluster.this -target=helm_release.calico -target=null_resource.calico_ready
          terraform apply -input=false -auto-approve

      - name: Smoke test
        env:
          KUBECONFIG: ~/.kube/rift-local.yaml
        run: deploy/scripts/smoke.sh

      - name: Describe failures
        if: failure()
        env:
          KUBECONFIG: ~/.kube/rift-local.yaml
        run: |
          kubectl get pods -A
          kubectl -n rift describe pods | tail -200
          kubectl -n rift logs -l app.kubernetes.io/name=rift --all-containers --tail=100 || true
