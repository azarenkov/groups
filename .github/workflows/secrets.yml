name: Secrets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the pushed commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          RANGE="$BASE..$HEAD"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$HEAD"
          fi
          docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --log-opts="$RANGE" --redact --no-banner

      - name: Refuse Terraform state, variable files and keys
        run: |
          tracked="$(git ls-files | grep -E '(^|/)\.terraform/|\.tfstate(\..*)?$|\.tfvars$|\.pem$|\.key$|(^|/)\.env$|^env/' || true)"
          if [ -n "$tracked" ]; then
            echo "These files must not be committed:"
            echo "$tracked"
            exit 1
          fi
