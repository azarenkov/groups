name: CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      libs: ${{ steps.filter.outputs.libs }}
      identity: ${{ steps.filter.outputs.identity }}
      media: ${{ steps.filter.outputs.media }}
      messaging: ${{ steps.filter.outputs.messaging }}
      voice: ${{ steps.filter.outputs.voice }}
      realtime: ${{ steps.filter.outputs.realtime }}
      notification: ${{ steps.filter.outputs.notification }}
      workers: ${{ steps.filter.outputs.workers }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            libs:
              - 'backend/libs/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
            identity:
              - 'backend/services/identity/**'
            media:
              - 'backend/services/media/**'
            messaging:
              - 'backend/services/messaging/**'
            voice:
              - 'backend/services/voice/**'
            realtime:
              - 'backend/services/realtime/**'
            notification:
              - 'backend/services/notification/**'
            workers:
              - 'backend/workers/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx react-scripts test --watchAll=false
        env:
          CI: true
      - run: npm run build
        env:
          CI: true
          GENERATE_SOURCEMAP: 'false'

  full:
    needs: changes
    if: needs.changes.outputs.libs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/check_sql.py
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace

  outbox-integration:
    needs: changes
    if: needs.changes.outputs.libs == 'true' || needs.changes.outputs.messaging == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: outbox-integration
      - run: cargo test -p infrastructure-common --test outbox_ordering -- --ignored
        env:
          RIFT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  service:
    needs: changes
    if: needs.changes.outputs.libs != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity
            changed: ${{ needs.changes.outputs.identity }}
            packages: -p identity -p identity-service
          - name: media
            changed: ${{ needs.changes.outputs.media }}
            packages: -p media -p media-service
          - name: messaging
            changed: ${{ needs.changes.outputs.messaging }}
            packages: -p messaging -p messaging-service -p contracts -p livekit-pooler
          - name: voice
            changed: ${{ needs.changes.outputs.voice }}
            packages: -p voice -p voice-service
          - name: realtime
            changed: ${{ needs.changes.outputs.realtime }}
            packages: -p realtime-domain -p realtime-core -p realtime-infrastructure -p realtime
          - name: notification
            changed: ${{ needs.changes.outputs.notification }}
            packages: -p notification-core -p notification-infrastructure -p notification-service
          - name: workers
            changed: ${{ needs.changes.outputs.workers }}
            packages: -p outbox-worker -p livekit-pooler
    steps:
      - name: Skip unchanged
        if: matrix.changed != 'true'
        run: echo "no changes for ${{ matrix.name }}"
      - uses: actions/checkout@v4
        if: matrix.changed == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.changed == 'true'
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: matrix.changed == 'true'
        with:
          key: ${{ matrix.name }}
      - name: SQL literals
        if: matrix.changed == 'true'
        run: python3 scripts/check_sql.py
      - name: Clippy
        if: matrix.changed == 'true'
        run: cargo clippy ${{ matrix.packages }} -- -D warnings
      - name: Test
        if: matrix.changed == 'true'
        run: cargo test ${{ matrix.packages }}
