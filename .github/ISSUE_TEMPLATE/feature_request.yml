name: Feature request
description: Suggest a new capability or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user-facing problem does this solve? Why is the current state not enough?
      placeholder: As a user I can't do X without leaving the app, which breaks my flow…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you'd like to see. Mockups, API sketches, and small examples are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you didn't pick them.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the codebase would this change touch?
      options:
        - Frontend (Electron / React)
        - Backend HTTP
        - Backend WebSocket
        - Backend Outbox service
        - Backend Notification service
        - Database / migrations
        - Voice (LiveKit)
        - Auth
        - Cross-cutting / docs
        - Not sure
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links, prior art, screenshots, related issues.
    validations:
      required: false
