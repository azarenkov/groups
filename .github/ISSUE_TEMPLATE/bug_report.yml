name: Bug report
description: Something is broken or behaving unexpectedly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below so we can reproduce and fix it quickly.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
      placeholder: When I do X, Y happens — but I expected Z.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, deterministic reproduction. Numbered steps work best.
      placeholder: |
        1. Sign in as a regular user
        2. Open #general
        3. Click the bell icon
        4. See error in console
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Include error messages, stack traces, screenshots if helpful.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the codebase is affected?
      options:
        - Frontend (Electron / React)
        - Backend API
        - Backend WebSocket
        - Database / migrations
        - Voice (LiveKit)
        - Auth
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Git commit SHA, release tag, or branch you tested on.
      placeholder: main @ 042aaad
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other / not applicable
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / context
      description: Relevant log lines, network traces, or other context. Wrap long blocks in triple backticks.
      render: shell
    validations:
      required: false
