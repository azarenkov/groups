[workspace]
resolver = "3"
members = [
    "backend/crates/domain",
    "backend/crates/application",
    "backend/crates/infrastructure",
    "backend/crates/shared",
    "backend/api",
    "backend/outbox-worker", "backend/notification-service", "backend/websocket", "backend/event-dispatcher", "backend/realtime", "backend/livekit-pooler"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.21", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
async-trait = "0.1"
tracing = "0.1"
envy = "0.4.2"
dotenv = "0.15.0"
futures = "0.3.32"
env_logger = "0.11.9"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-log = "0.2"
actix-web = "4.13.0"
actix-cors = "0.7.1"
validator = { version = "0.21", features = ["derive"] }
tokio = "1.50.0"
async-nats = "0.46"
rand = "0.10.1"
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }
anyhow = "1.0.102"
rust-s3 = { version = "0.35", default-features = false, features = ["tokio-rustls-tls"] }
actix-multipart = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

domain = { path = "backend/crates/domain" }
application = { path = "backend/crates/application" }
infrastructure = { path = "backend/crates/infrastructure" }
shared = { path = "backend/crates/shared" }
