[workspace]
resolver = "3"
members = [
    "backend/libs/contracts",
    "backend/libs/infrastructure-common",
    "backend/services/identity/core",
    "backend/services/media/core",
    "backend/services/messaging/core",
    "backend/services/voice/core",
    "backend/services/identity/infrastructure",
    "backend/services/media/infrastructure",
    "backend/services/messaging/infrastructure",
    "backend/services/voice/infrastructure",
    "backend/libs/domain",
    "backend/libs/ports",
    "backend/services/messaging/domain",
    "backend/services/identity/domain",
    "backend/services/media/domain",
    "backend/services/voice/domain",
    "backend/libs/api-common",
    "backend/services/identity/api",
    "backend/services/media/api",
    "backend/services/messaging/api",
    "backend/services/voice/api",
    "backend/workers/outbox-worker",
    "backend/services/notification/core",
    "backend/services/notification/infrastructure",
    "backend/services/notification/api",
    "backend/services/realtime/domain",
    "backend/services/realtime/core",
    "backend/services/realtime/infrastructure",
    "backend/services/realtime/api",
    "backend/workers/livekit-pooler",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.21", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
async-trait = "0.1"
tracing = "0.1"
envy = "0.4.2"
dotenv = "0.15.0"
futures = "0.3.32"
env_logger = "0.11.9"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-log = "0.2"
actix-web = "4.13.0"
actix-cors = "0.7.1"
validator = { version = "0.21", features = ["derive"] }
chrono-tz = "0.10"
redis = { version = "0.32", features = ["tokio-comp", "connection-manager", "script"] }
tokio = "1.50.0"
tokio-util = { version = "0.7", features = ["io"] }
base64 = "0.22"
jpeg-decoder = { version = "0.3", default-features = false }
symphonia = { version = "0.5", default-features = false, features = ["mkv", "ogg", "isomp4"] }
async-nats = "0.46"
rand = "0.10.1"
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }
anyhow = "1.0.102"
rust-s3 = { version = "0.35", default-features = false, features = ["tokio-rustls-tls"] }
actix-multipart = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
gif = "0.14"

contracts = { path = "backend/libs/contracts" }
infrastructure-common = { path = "backend/libs/infrastructure-common" }
identity = { path = "backend/services/identity/core" }
media = { path = "backend/services/media/core" }
messaging = { path = "backend/services/messaging/core" }
voice = { path = "backend/services/voice/core" }
identity-infrastructure = { path = "backend/services/identity/infrastructure" }
media-infrastructure = { path = "backend/services/media/infrastructure" }
messaging-infrastructure = { path = "backend/services/messaging/infrastructure" }
notification-core = { path = "backend/services/notification/core" }
notification-infrastructure = { path = "backend/services/notification/infrastructure" }
realtime-domain = { path = "backend/services/realtime/domain" }
realtime-core = { path = "backend/services/realtime/core" }
realtime-infrastructure = { path = "backend/services/realtime/infrastructure" }
voice-infrastructure = { path = "backend/services/voice/infrastructure" }
api-common = { path = "backend/libs/api-common" }
domain = { path = "backend/libs/domain" }
ports = { path = "backend/libs/ports" }
messaging-domain = { path = "backend/services/messaging/domain" }
identity-domain = { path = "backend/services/identity/domain" }
media-domain = { path = "backend/services/media/domain" }
voice-domain = { path = "backend/services/voice/domain" }
