image:
  registry: ghcr.io/rift-space/rift
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

config:
  RUST_LOG: info
  NATS_URL: nats://nats:4222
  NATS_SUBJECT_PREFIX: rift.events
  NATS_REPLICAS: "1"
  NATS_STREAM_HOT_MAX_BYTES: "2147483648"
  NATS_STREAM_COLD_MAX_BYTES: "536870912"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_OPTIONS: ""
  POSTGRES_MAX_CONNECTIONS: "10"
  POSTGRES_MIN_CONNECTIONS: "2"
  POSTGRES_CONNECT_TIMEOUT_SECONDS: "30"
  POSTGRES_IDLE_TIMEOUT_SECONDS: "600"
  POSTGRES_MAX_LIFETIME_SECONDS: "1800"
  POSTGRES_RUN_MIGRATIONS: "true"
  REDIS_URL: redis://redis:6379
  LIVEKIT_URL: http://livekit:7880
  LIVEKIT_CLIENT_URL: wss://livekit.rift.example.com
  LIVEKIT_API_KEY: rift-server
  MINIO_ENDPOINT: http://minio:9000
  MINIO_BUCKET: rift-attachments
  NSFW_DETECTOR_URL: http://nsfw-detector:8000
  NSFW_THRESHOLD: "0.8"
  TEXT_TOXICITY_THRESHOLD: "0.8"
  PUBLIC_APP_URL: https://app.rift.example.com
  CORS_ALLOWED_ORIGINS: "https://app.rift.example.com,file://,null"
  MESSAGING_INTERNAL_URL: http://messaging-service:8080
  MEDIA_INTERNAL_URL: http://media-service:8080
  VOICE_INTERNAL_URL: http://voice-service:8080
  TRUST_FORWARDED_HEADERS: "true"
  RATE_LIMITING_REQUESTS: "10"
  RATE_LIMITING_BURST_SIZE: "60"
  ALTCHA_MAX_NUMBER: "50000"
  ALTCHA_EXPIRES_SECS: "300"
  ALTCHA_LOGIN_FAILURES: "3"
  ALTCHA_LOGIN_WINDOW_SECS: "900"
  RESERVED_USERNAMES: ""
  MAILER_HOST: smtp.example.com
  MAILER_PORT: "465"
  MAILER_FROM: noreply@example.com
  MAILER_PASSWORD_RESET_BASE_URL: https://rift.example.com
  HEALTH_PROBE_TIMEOUT_MS: "2000"
  HEALTH_PROBE_CACHE_MS: "5000"
  SHUTDOWN_DRAIN_MS: "3000"
  SHUTDOWN_TIMEOUT_SECS: "25"

secrets:
  existingSecret: ""
  JWT_SECRET: ""
  ALTCHA_HMAC_KEY: ""
  INTERNAL_API_TOKEN: ""
  LIVEKIT_API_SECRET: ""
  MINIO_ROOT_USER: ""
  MINIO_ROOT_PASSWORD: ""
  MAILER_USERNAME: ""
  MAILER_PASSWORD: ""

databases:
  existingSecret: ""
  services:
    identity:
      name: rift_identity
      user: identity
      password: ""
    media:
      name: rift_media
      user: media
      password: ""
    messaging:
      name: rift_messaging
      user: messaging
      password: ""
    voice:
      name: rift_voice
      user: voice
      password: ""
    realtime:
      name: rift_realtime
      user: realtime
      password: ""
  bootstrap:
    enabled: true
    image: postgres:16-alpine
    adminUser: postgres
    adminDatabase: postgres
    adminPassword: ""
    existingSecret: ""
    existingSecretKey: admin-password
    backoffLimit: 6
    activeDeadlineSeconds: 600
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }

probes:
  startup:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60
  readiness:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

shutdown:
  preStopSeconds: 5
  terminationGracePeriodSeconds: 40

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 0
  scaleDownStabilizationSeconds: 300

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
  ingressController:
    namespaceSelector: {}
    podSelector: {}
    ipBlocks: []
    allowAnySource: false
  extraFrom: {}

monitoring:
  enabled: false
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: monitoring
  scrapeInterval: 30s
  outbox:
    stuckFor: 5m
    oldestPendingSeconds: 300
    oldestPendingFor: 10m
    dedupeWindowSeconds: 600

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

httpServices:
  identity-service:
    enabled: true
    replicas: 2
    databases: [identity]
    env:
      UNVERIFIED_CLEANUP_ENABLED: "true"
      UNVERIFIED_ACCOUNT_TTL_HOURS: "24"
      UNVERIFIED_CLEANUP_INTERVAL_SECS: "900"
      UNVERIFIED_CLEANUP_BATCH_SIZE: "200"
      ACCESS_REVOCATION_RETRY_INTERVAL_SECS: "30"
      ACCESS_REVOCATION_RETRY_BATCH_SIZE: "100"
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 512Mi }
  media-service:
    enabled: true
    replicas: 2
    databases: [media]
    env: {}
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 512Mi }
    tmpSizeLimit: 512Mi
  messaging-service:
    enabled: true
    replicas: 2
    databases: [messaging]
    env: {}
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 512Mi }
  voice-service:
    enabled: true
    replicas: 2
    databases: [voice]
    env: {}
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 512Mi }

realtime:
  enabled: true
  replicas: 2
  databases: [realtime]
  env:
    WEBSOCKET_OUTBOUND_BUFFER: "64"
    DISPATCHER_USER_STREAM: RIFT_USER_EVENTS
    DISPATCHER_CHANNEL_STREAM: RIFT_CHANNEL_EVENTS
    DISPATCHER_MESSAGE_STREAM: RIFT_MESSAGE_EVENTS
    DISPATCHER_DM_MESSAGE_STREAM: RIFT_DM_MESSAGE_EVENTS
    DISPATCHER_COMMUNITY_STREAM: RIFT_COMMUNITY_EVENTS
    DISPATCHER_CONSUMER_PREFIX: event-dispatcher
    DISPATCHER_MAX_DELIVER: "10"
    DISPATCHER_LIVENESS_STALE_SECS: "30"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

workers:
  outbox-worker:
    enabled: true
    replicas: 1
    healthPort: 8081
    databases: [identity, messaging, voice]
    env:
      HEALTH_PORT: "8081"
      OUTBOX_SOURCES: identity,messaging,voice
      OUTBOX_BATCH_SIZE: "100"
      OUTBOX_IDLE_INTERVAL_MS: "500"
      OUTBOX_MAX_ATTEMPTS: "50"
      OUTBOX_BACKOFF_BASE_SECS: "5"
      OUTBOX_BACKOFF_MAX_MULTIPLIER: "10"
      OUTBOX_CLEANUP_INTERVAL_SECS: "3600"
      OUTBOX_CLEANUP_RETENTION_SECS: "604800"
      OUTBOX_CLEANUP_BATCH_SIZE: "10000"
      OUTBOX_LIVENESS_STALE_SECS: "60"
      OUTBOX_METRICS_INTERVAL_SECS: "15"
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
  notification-service:
    enabled: true
    replicas: 1
    healthPort: 8082
    databases: []
    env:
      HEALTH_PORT: "8082"
      NOTIFICATION_USER_STREAM: RIFT_USER_EVENTS
      NOTIFICATION_VERIFICATION_CONSUMER: notification-service-verification
      NOTIFICATION_MAX_DELIVER: "5"
      NOTIFICATION_LIVENESS_STALE_SECS: "60"
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
  livekit-pooler:
    enabled: true
    replicas: 1
    healthPort: 8086
    databases: [messaging]
    env:
      LIVEKIT_POOLER_HEALTH_PORT: "8086"
      LIVEKIT_POOLER_INTERVAL_SECS: "30"
      LIVEKIT_POOLER_GRACE_SECS: "20"
      LIVEKIT_POOLER_REQUEST_TIMEOUT_SECS: "10"
      LIVEKIT_POOLER_MAX_ABORTS_PER_PASS: "500"
      LIVEKIT_POOLER_LIVENESS_STALE_SECS: "120"
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }

nsfwDetector:
  enabled: true
  replicas: 1
  startupFailureThreshold: 120
  env: {}
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { memory: 4Gi }

gateway:
  enabled: true
  replicas: 2
  image: nginxinc/nginx-unprivileged:1.27-alpine
  clusterDomain: cluster.local
  resolverIpv6: "off"
  livekitUpstream: ""
  trustedProxies: []
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  service:
    type: ClusterIP
    port: 80
    livekitPort: 7880
  ingress:
    enabled: false
    className: ""
    host: rift.example.com
    livekitHost: livekit.rift.example.com
    annotations: {}
    tls: []
    apiPaths:
      - { path: /api, pathType: Prefix }
      - { path: /ws, pathType: Exact }
      - { path: /presence, pathType: Exact }
      - { path: /healthz, pathType: Exact }

web:
  enabled: true
  replicas: 2
  apiUrl: /api
  wsUrl: /ws
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }

livekit:
  externalName: ""
