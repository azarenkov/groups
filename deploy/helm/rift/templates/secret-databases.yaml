{{- if not .Values.databases.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rift.databaseSecretName" . }}
  labels:
    {{- include "rift.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $db := .Values.databases }}
  {{- if ne $name "existingSecret" }}
  {{ $name }}-password: {{ $db.password | toString | quote }}
  {{- end }}
  {{- end }}
{{- end }}
