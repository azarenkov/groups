{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "rift.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- include "rift.replicas" (dict "root" . "workload" .Values.web) | nindent 2 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "rift.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rift.selectorLabels" (dict "root" . "component" "web") | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.shutdown.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      {{- include "rift.podScheduling" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "rift.image" (dict "root" . "service" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: RIFT_API_URL
              value: {{ .Values.web.apiUrl | quote }}
            - name: RIFT_WS_URL
              value: {{ .Values.web.wsUrl | quote }}
            - name: RIFT_GOOGLE_CLIENT_ID
              value: {{ .Values.config.GOOGLE_CLIENT_ID | default "" | quote }}
          securityContext:
            {{- include "rift.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ .Values.shutdown.preStopSeconds }}; nginx -s quit; sleep {{ .Values.shutdown.preStopSeconds }}"]
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "rift.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "rift.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
