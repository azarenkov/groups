{{- if .Values.networkPolicy.enabled }}
{{- $root := . -}}
{{- $np := .Values.networkPolicy -}}
{{- $fromGateway := list (dict "podSelector" (dict "matchLabels" (include "rift.selectorLabels" (dict "root" . "component" "gateway") | fromYaml))) -}}
{{- $fromIngress := list -}}
{{- if $np.ingressController.namespaceSelector }}
{{- $peer := dict "namespaceSelector" $np.ingressController.namespaceSelector }}
{{- with $np.ingressController.podSelector }}{{ $_ := set $peer "podSelector" . }}{{ end }}
{{- $fromIngress = append $fromIngress $peer }}
{{- end }}
{{- $fromServices := list (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" "rift" "app.kubernetes.io/instance" .Release.Name "rift.dev/calls-services" "true"))) -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny-ingress
  labels:
    {{- include "rift.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rift
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
{{- if .Values.gateway.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "rift.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rift.selectorLabels" (dict "root" . "component" "gateway") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - {{- if $fromIngress }}
      from:
        {{- toYaml $fromIngress | nindent 8 }}
      {{- end }}
      ports:
        - port: 8080
        - port: 7880
{{- end }}
{{- if .Values.web.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "rift.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rift.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - {{- if $fromIngress }}
      from:
        {{- toYaml $fromIngress | nindent 8 }}
      {{- end }}
      ports:
        - port: 8080
{{- end }}
{{- range $name, $svc := .Values.httpServices }}
{{- if $svc.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "rift.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rift.selectorLabels" (dict "root" $root "component" $name) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml (concat $fromGateway $fromServices (index $np.extraFrom $name | default list)) | nindent 8 }}
      ports:
        - port: 8080
{{- end }}
{{- end }}
{{- if .Values.realtime.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: realtime
  labels:
    {{- include "rift.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rift.selectorLabels" (dict "root" . "component" "realtime") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml $fromGateway | nindent 8 }}
      ports:
        - port: 8083
{{- end }}
{{- if .Values.nsfwDetector.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nsfw-detector
  labels:
    {{- include "rift.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rift.selectorLabels" (dict "root" . "component" "nsfw-detector") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml $fromServices | nindent 8 }}
      ports:
        - port: 8000
{{- end }}
{{- end }}
