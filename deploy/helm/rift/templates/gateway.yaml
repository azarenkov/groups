{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "rift.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
data:
  nginx.conf.template: |
{{ include "rift.gatewayConfig" . | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "rift.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{- include "rift.replicas" (dict "root" . "workload" .Values.gateway) | nindent 2 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "rift.selectorLabels" (dict "root" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rift.selectorLabels" (dict "root" . "component" "gateway") | nindent 8 }}
      annotations:
        checksum/nginx: {{ include "rift.gatewayConfig" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.shutdown.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      {{- include "rift.podScheduling" . | nindent 6 }}
      containers:
        - name: nginx
          image: {{ .Values.gateway.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - >-
              mkdir -p /tmp/nginx;
              export NGINX_RESOLVER="$(awk '/^nameserver/ { print $2; exit }' /etc/resolv.conf)";
              exec /docker-entrypoint.sh nginx -c /tmp/nginx/nginx.conf -g 'daemon off;'
          env:
            - name: NGINX_ENVSUBST_OUTPUT_DIR
              value: /tmp/nginx
            - name: NGINX_ENVSUBST_FILTER
              value: "^NGINX_"
            - name: NGINX_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NGINX_CLUSTER_DOMAIN
              value: {{ .Values.gateway.clusterDomain | quote }}
            - name: NGINX_RESOLVER_IPV6
              value: {{ .Values.gateway.resolverIpv6 | quote }}
            - name: NGINX_LIVEKIT_UPSTREAM
              value: {{ .Values.gateway.livekitUpstream | default (printf "http://livekit.%s.svc.%s:7880" .Release.Namespace .Values.gateway.clusterDomain) | quote }}
          securityContext:
            {{- include "rift.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
            - name: livekit
              containerPort: 7880
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ .Values.shutdown.preStopSeconds }}; nginx -s quit; sleep {{ .Values.shutdown.preStopSeconds }}"]
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-template
              mountPath: /etc/nginx/templates
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-template
          configMap:
            name: {{ .Release.Name }}-gateway
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "rift.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    {{- include "rift.selectorLabels" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
    - name: livekit
      port: {{ .Values.gateway.service.livekitPort }}
      targetPort: livekit
{{- if .Values.gateway.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "rift.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with .Values.gateway.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.gateway.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.gateway.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.gateway.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.web.enabled }}
          {{- range .Values.gateway.ingress.apiPaths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $.Release.Name }}-gateway
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-web
                port:
                  name: http
          {{- else }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-gateway
                port:
                  name: http
          {{- end }}
    {{- with .Values.gateway.ingress.livekitHost }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-gateway
                port:
                  name: livekit
    {{- end }}
{{- end }}
{{- end }}
