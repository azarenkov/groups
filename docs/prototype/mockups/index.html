<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groups mockups</title>
<style>
  :root { --brand:#5b5fc7; --brand-soft:#e8e9fb; --ink:#242424; --muted:#616161; --line:#e1e1e1; --bg:#f5f5f5; --ok:#13a10e; --warn:#c4314b; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; color:var(--ink); background:#fff; }
  .frame { width:1280px; height:780px; display:none; grid-template-columns:64px 260px 1fr; border:1px solid var(--line); }
  .frame.on { display:grid; }
  .rail { background:#ebebeb; display:flex; flex-direction:column; align-items:center; gap:14px; padding-top:14px; }
  .rail span { width:40px; height:40px; border-radius:10px; display:grid; place-items:center; color:var(--muted); font-size:11px; }
  .rail span.on { background:#fff; color:var(--brand); font-weight:600; box-shadow:0 1px 2px #0001; }
  .side { background:var(--bg); border-right:1px solid var(--line); padding:14px 10px; overflow:hidden; }
  .side h3 { margin:4px 8px 10px; font-size:15px; }
  .group { display:flex; gap:8px; align-items:center; padding:6px 8px; border-radius:6px; font-weight:600; }
  .avatar { width:28px; height:28px; border-radius:6px; background:var(--brand); color:#fff; display:grid; place-items:center; font-size:12px; font-weight:700; flex:none; }
  .avatar.round { border-radius:50%; }
  .ch { padding:5px 8px 5px 44px; border-radius:6px; color:var(--muted); }
  .ch.on { background:#fff; color:var(--ink); font-weight:600; }
  .main { display:flex; flex-direction:column; min-width:0; }
  .top { height:56px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:18px; padding:0 20px; }
  .top b { font-size:16px; }
  .tab { color:var(--muted); padding:17px 2px; border-bottom:2px solid transparent; }
  .tab.on { color:var(--ink); border-color:var(--brand); font-weight:600; }
  .top .right { margin-left:auto; display:flex; gap:8px; }
  .btn { border:1px solid var(--line); background:#fff; border-radius:6px; padding:6px 12px; font-weight:600; font-size:13px; }
  .btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  .body { flex:1; overflow:hidden; padding:16px 24px; background:#fafafa; }
  .msg { display:flex; gap:10px; margin:0 0 14px; }
  .bubble { background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 12px; max-width:720px; }
  .meta { font-size:12px; color:var(--muted); margin-bottom:2px; }
  .meta b { color:var(--ink); margin-right:6px; }
  .reacts { display:flex; gap:6px; margin-top:6px; }
  .react { border:1px solid var(--line); border-radius:12px; padding:1px 8px; font-size:12px; background:#fff; }
  .react.mine { border-color:var(--brand); background:var(--brand-soft); }
  .thread { margin-top:6px; color:var(--brand); font-weight:600; font-size:12px; }
  .announce { border-left:4px solid var(--brand); }
  .tag { display:inline-block; font-size:11px; font-weight:700; padding:1px 6px; border-radius:4px; background:var(--brand-soft); color:var(--brand); margin-right:6px; }
  .file { display:flex; gap:10px; align-items:center; border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:#fff; width:340px; margin-top:6px; }
  .file i { width:32px; height:38px; border-radius:4px; background:#c43e1c; color:#fff; font-style:normal; font-size:10px; font-weight:700; display:grid; place-items:center; }
  .composer { border-top:1px solid var(--line); padding:12px 24px; background:#fff; }
  .composer div { border:1px solid var(--line); border-radius:8px; padding:10px 12px; color:var(--muted); }
  .panel { width:360px; border-left:1px solid var(--line); background:#fff; padding:14px 16px; }
  .split { display:flex; flex:1; min-height:0; }
  .note { position:absolute; left:80px; bottom:12px; font-size:11px; color:var(--muted); background:#fff9; padding:2px 6px; border-radius:4px; }
  .wrap { position:relative; }
  .viewer { flex:1; background:#3b3b3b; display:flex; flex-direction:column; }
  .vbar { height:48px; background:#2b2b2b; color:#fff; display:flex; align-items:center; gap:14px; padding:0 16px; font-size:13px; }
  .vbar .right { margin-left:auto; display:flex; gap:10px; }
  .page { width:560px; height:640px; background:#fff; margin:18px auto; padding:44px 48px; box-shadow:0 2px 8px #0006; }
  .page h1 { font-size:22px; margin:0 0 14px; }
  .line { height:9px; background:#e6e6e6; border-radius:3px; margin:10px 0; }
  .call { flex:1; background:#1f1f1f; display:grid; grid-template-columns:1fr 280px; gap:12px; padding:16px; }
  .screen { background:#fff; border-radius:8px; display:flex; flex-direction:column; overflow:hidden; }
  .screen .cap { background:#111; color:#fff; font-size:12px; padding:6px 10px; }
  .tiles { display:grid; gap:12px; grid-template-rows:repeat(4,1fr); }
  .tile { background:#333; border-radius:8px; color:#fff; display:flex; align-items:flex-end; padding:8px; font-size:12px; position:relative; }
  .tile.speaking { outline:3px solid var(--brand); }
  .tile .mic { position:absolute; top:8px; right:8px; font-size:11px; background:#0008; padding:1px 6px; border-radius:8px; }
  .callbar { height:64px; background:#2b2b2b; display:flex; gap:12px; align-items:center; justify-content:center; }
  .callbar span { color:#fff; background:#444; border-radius:8px; padding:8px 14px; font-size:13px; }
  .callbar .leave { background:var(--warn); }
  .form label { display:block; font-weight:600; margin:14px 0 6px; }
  .input { border:1px solid var(--line); background:#fff; border-radius:6px; padding:9px 12px; color:var(--muted); }
  .input.area { height:110px; }
  .row { display:flex; gap:16px; }
  .row > div { flex:1; }
  table { border-collapse:collapse; width:100%; background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); font-size:13px; }
  th { background:#f3f3f3; font-size:12px; color:var(--muted); }
  .pill { font-size:11px; font-weight:700; border-radius:10px; padding:2px 8px; }
  .pill.in { background:#e0f3df; color:var(--ok); }
  .pill.late { background:#fbe3e7; color:var(--warn); }
  .pill.none { background:#eee; color:var(--muted); }
  .pill.ret { background:var(--brand-soft); color:var(--brand); }
  .cal { display:grid; grid-template-columns:60px repeat(5,1fr); background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; height:600px; }
  .cal div { border-right:1px solid var(--line); border-bottom:1px solid var(--line); font-size:12px; padding:4px 6px; position:relative; }
  .cal .h { background:#f3f3f3; font-weight:600; text-align:center; padding:8px; }
  .ev { position:absolute; left:4px; right:4px; border-radius:6px; padding:4px 6px; font-size:12px; color:#fff; background:var(--brand); }
  .ev.alt { background:#13a10e; }
  .ev.due { background:var(--warn); }
</style>
</head>
<body>

<script>
  const side = (active) => `
    <div class="rail"><span class="on">Groups</span><span>Chat</span><span>Calendar</span><span>Calls</span><span>Files</span><span>Inbox</span></div>
    <div class="side">
      <h3>Groups</h3>
      <div class="group"><div class="avatar">SE</div>Software Engineering · CS-301</div>
      ${["General","Announcements","Project team 4","Lectures (voice)"].map(c => `<div class="ch${c===active?' on':''}">${c.includes('voice')?'🔊 ':'# '}${c}</div>`).join('')}
      <div class="group" style="margin-top:12px"><div class="avatar" style="background:#13a10e">DB</div>Databases · CS-210</div>
      <div class="group"><div class="avatar" style="background:#c43e1c">ML</div>Machine Learning · CS-420</div>
    </div>`;
  const msg = (who, color, time, text, extra = '') => `
    <div class="msg"><div class="avatar round" style="background:${color}">${who.split(' ').map(w=>w[0]).join('')}</div>
    <div class="bubble"><div class="meta"><b>${who}</b>${time}</div>${text}${extra}</div></div>`;
</script>

<!-- 1. Channel chat -->
<section class="frame wrap" id="chat"></section>
<script>
document.getElementById('chat').innerHTML = side('General') + `
  <div class="main">
    <div class="top"><b># General</b><span class="tab on">Posts</span><span class="tab">Files</span><span class="tab">Assignments</span><span class="tab">Notes</span><div class="right"><span class="btn">🔊 Meet</span></div></div>
    <div class="split">
      <div class="body">
        ${msg('Dana Seitkali','#5b5fc7','Teacher · 09:02','<span class="tag">Announcement</span>Lab 3 is moved to Thursday, 14:00, room 412. Slides are attached.',
          '<div class="file"><i>PPTX</i><div><b>Lab3-Testing.pptx</b><br><span class="meta">2.4 MB · open in viewer</span></div></div><div class="reacts"><span class="react mine">👍 18</span><span class="react">✅ 6</span></div><div class="thread">3 replies · last 09:40</div>')}
        ${msg('Arman K.','#13a10e','09:15','Will the quiz from Lab 2 still be on Tuesday?','<div class="reacts"><span class="react">👀 4</span></div>')}
        ${msg('Aliya S.','#c43e1c','09:21','I uploaded our draft of the requirements, comments welcome 🙏',
          '<div class="file"><i style="background:#185abd">DOCX</i><div><b>Team4-Requirements.docx</b><br><span class="meta">180 KB · open in viewer</span></div></div>')}
      </div>
      <div class="panel">
        <b>Thread</b><div class="meta" style="margin:6px 0 12px">Lab 3 is moved to Thursday…</div>
        ${msg('Timur B.','#8764b8','09:31','Is attendance required for the online group?')}
        ${msg('Dana Seitkali','#5b5fc7','Teacher · 09:40','Yes, the online group joins the Lectures voice channel.')}
        <div class="composer" style="padding:8px 0"><div>Reply in thread…</div></div>
      </div>
    </div>
    <div class="composer"><div>Message # General&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;<b>B</b>&nbsp;&nbsp;<i>I</i>&nbsp;&nbsp;&lt;/&gt;&nbsp;&nbsp;📎&nbsp;&nbsp;😊</div></div>
  </div>
  <div class="note">Mockup · FR-11, FR-14, FR-15, FR-20</div>`;
</script>

<!-- 2. Document viewer -->
<section class="frame wrap" id="viewer"></section>
<script>
document.getElementById('viewer').innerHTML = side('Project team 4') + `
  <div class="main">
    <div class="viewer">
      <div class="vbar"><b>Team4-Requirements.docx</b><span>Page 2 / 7</span><span>◀ ▶</span><div class="right"><span>－ 100% ＋</span><span>↔ Fit width</span><span>⬇ Download</span><span>✕</span></div></div>
      <div class="page"><h1>2. Functional requirements</h1>
        ${Array.from({length:18},(_,i)=>`<div class="line" style="width:${70+((i*37)%30)}%"></div>`).join('')}
      </div>
    </div>
  </div>
  <div class="note" style="color:#ccc">Implemented · FR-30</div>`;
</script>

<!-- 3. Lesson call -->
<section class="frame wrap" id="call"></section>
<script>
document.getElementById('call').innerHTML = side('Lectures (voice)') + `
  <div class="main">
    <div class="top"><b>🔊 Lectures (voice)</b><span class="meta">27 participants · 00:42:15</span><div class="right"><span class="btn">✋ 2 raised hands</span><span class="btn">Participants</span></div></div>
    <div class="call">
      <div class="screen"><div class="cap">Dana Seitkali is sharing the screen</div><div class="page" style="margin:20px auto;width:640px;height:400px"><h1>Unit testing in practice</h1>${Array.from({length:8},()=>'<div class="line"></div>').join('')}</div></div>
      <div class="tiles">
        <div class="tile speaking">Dana Seitkali · Teacher<span class="mic">🎙</span></div>
        <div class="tile">Arman K.<span class="mic">🔇</span></div>
        <div class="tile">Aliya S.<span class="mic">🔇</span></div>
        <div class="tile">+24 more</div>
      </div>
    </div>
    <div class="callbar"><span>🎙 Mute</span><span>📷 Camera</span><span>🖥 Share</span><span>✋ Raise hand</span><span>😊 React</span><span class="leave">Leave</span></div>
  </div>
  <div class="note" style="color:#ccc">Calls and screen sharing implemented (FR-40, FR-41) · hands and reactions planned (FR-42)</div>`;
</script>

<!-- 4. Create assignment -->
<section class="frame wrap" id="assignment"></section>
<script>
document.getElementById('assignment').innerHTML = side('General') + `
  <div class="main">
    <div class="top"><b>Software Engineering · CS-301</b><span class="tab">Posts</span><span class="tab">Files</span><span class="tab on">Assignments</span><div class="right"><span class="btn">Discard</span><span class="btn primary">Assign</span></div></div>
    <div class="body form" style="max-width:820px">
      <label>Title</label><div class="input" style="color:var(--ink)">Lab 3 — Unit tests for the order service</div>
      <label>Instructions</label><div class="input area">Write unit tests for the three use cases from the lecture. Coverage of at least 80 %. Submit the repository link and a short report (PDF).</div>
      <label>Reference materials</label><div class="file"><i>PDF</i><div><b>Lab3-Task.pdf</b><br><span class="meta">420 KB</span></div></div>
      <div class="row"><div><label>Due</label><div class="input" style="color:var(--ink)">Thu, 30 Oct 2026, 23:59</div></div><div><label>Points</label><div class="input" style="color:var(--ink)">10</div></div><div><label>Assign to</label><div class="input" style="color:var(--ink)">All students (24)</div></div></div>
      <label>Options</label><div class="input">☑ Allow late submissions (flagged)  ☑ Notify students  ☐ Post in General</div>
    </div>
  </div>
  <div class="note">Mockup · FR-21 (teacher)</div>`;
</script>

<!-- 5. Review submissions -->
<section class="frame wrap" id="grading"></section>
<script>
const rows = [['Arman K.','Turned in','in','29 Oct, 21:14','9 / 10'],['Aliya S.','Turned in','in','30 Oct, 18:02','—'],['Timur B.','Late','late','31 Oct, 09:30','—'],['Madina R.','Returned','ret','28 Oct, 16:45','10 / 10'],['Yerlan T.','Not turned in','none','—','—']];
document.getElementById('grading').innerHTML = side('General') + `
  <div class="main">
    <div class="top"><b>Lab 3 — Unit tests for the order service</b><span class="meta">Due 30 Oct, 23:59 · 10 points</span><div class="right"><span class="btn">Filter: All</span><span class="btn primary">Return 2</span></div></div>
    <div class="split">
      <div class="body">
        <table><tr><th>Student</th><th>Status</th><th>Turned in</th><th>Grade</th></tr>
        ${rows.map(r=>`<tr><td>${r[0]}</td><td><span class="pill ${r[2]}">${r[1]}</span></td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('')}
        </table>
        <div class="meta" style="margin-top:10px">21 of 24 turned in · 1 late · 3 not turned in</div>
      </div>
      <div class="panel form">
        <b>Aliya S.</b><div class="meta">Turned in 30 Oct, 18:02</div>
        <div class="file" style="width:auto"><i>PDF</i><div><b>Lab3-Report.pdf</b><br><span class="meta">open in viewer</span></div></div>
        <label>Feedback</label><div class="input area">Good structure. Add tests for the failure path of the payment use case.</div>
        <label>Points</label><div class="input" style="color:var(--ink)">8 / 10</div>
        <div style="margin-top:14px"><span class="btn primary">Return to student</span></div>
      </div>
    </div>
  </div>
  <div class="note">Mockup · FR-21 (grading)</div>`;
</script>

<!-- 6. Calendar -->
<section class="frame wrap" id="calendar"></section>
<script>
const days = ['Mon 27','Tue 28','Wed 29','Thu 30','Fri 31'];
const hours = ['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00'];
let cells = '<div class="h"></div>' + days.map(d=>`<div class="h">${d} Oct</div>`).join('');
hours.forEach((h,i)=>{ cells += `<div>${h}</div>` + days.map((d,j)=>{
  let ev='';
  if(i===0&&j===0) ev='<div class="ev" style="top:4px;height:120px">CS-301 Lecture<br>🔊 Lectures</div>';
  if(i===2&&j===1) ev='<div class="ev alt" style="top:4px;height:56px">CS-210 Seminar</div>';
  if(i===5&&j===3) ev='<div class="ev" style="top:4px;height:56px">Lab 3 (moved)<br>Room 412 + online</div>';
  if(i===7&&j===3) ev='<div class="ev due" style="top:30px;height:34px">Lab 3 due tonight, 23:59</div>';
  return `<div>${ev}</div>`;}).join(''); });
document.getElementById('calendar').innerHTML = side('General') + `
  <div class="main">
    <div class="top"><b>Calendar</b><span class="meta">27 – 31 October 2026</span><div class="right"><span class="btn">Today</span><span class="btn">◀ ▶</span><span class="btn primary">＋ New meeting</span></div></div>
    <div class="body"><div class="cal">${cells}</div></div>
  </div>
  <div class="note">Mockup · FR-22</div>`;
</script>

<script>
  const id = location.hash.slice(1) || 'chat';
  document.getElementById(id).classList.add('on');
</script>
</body>
</html>
