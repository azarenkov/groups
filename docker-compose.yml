services:
  postgres:
    image: postgres:16-alpine
    container_name: rift-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rift
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - rift-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rift"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rift-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - rift-network
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  redis:
    image: redis:7-alpine
    container_name: rift-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - rift-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  livekit:
    image: livekit/livekit-server:latest
    container_name: rift-livekit
    restart: unless-stopped
    command: --dev
    ports:
      - "7880:7880"
      - "7881:7881"
    networks:
      - rift-network
    environment:
      LIVEKIT_KEYS: "devkey: secret"

networks:
  rift-network:
    driver: bridge
    name: rift-network

volumes:
  postgres-data:
    name: rift-postgres-data
  pgadmin-data:
    name: rift-pgadmin-data
  redis-data:
    name: rift-redis-data
