services:
  postgres:
    image: postgres:16-alpine
    container_name: rift-postgres
    restart: unless-stopped
    env_file:
      - path: env/postgres.env
        required: false
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - rift-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: rift-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - rift-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  nats:
    image: nats:2.10-alpine
    container_name: rift-nats
    restart: unless-stopped
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    ports:
      - "4222:4222"
      - "8222:8222"
      - "6222:6222"
    volumes:
      - nats-data:/data
    networks:
      - rift-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4222"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  livekit:
    image: livekit/livekit-server:latest
    platform: linux/arm64
    container_name: rift-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    expose:
      - "7880"
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./docker/livekit/livekit.yaml:/etc/livekit.yaml:ro
    env_file:
      - path: env/livekit.env
        required: false
    networks:
      - rift-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7880 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  minio:
    image: minio/minio:latest
    container_name: rift-minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rift}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rift-minio-secret}
    expose:
      - "9000"
    volumes:
      - minio-data:/data
    networks:
      - rift-network
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nsfw-detector:
    build:
      context: .
      dockerfile: docker/nsfw-detector/Dockerfile
    container_name: rift-nsfw-detector
    restart: unless-stopped
    environment:
      TEXT_TOXICITY_THRESHOLD: ${TEXT_TOXICITY_THRESHOLD:-0.8}
    expose:
      - "8000"
    networks:
      - rift-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  identity-service:
    build:
      context: .
      dockerfile: docker/identity-service/Dockerfile
    container_name: rift-identity-service
    restart: unless-stopped
    stop_grace_period: 35s
    expose:
      - "8080"
    networks:
      - rift-network
    env_file:
      - path: env/postgres.env
        required: false
      - path: env/nats.env
        required: false
      - path: env/http.env
        required: false
      - path: env/identity-service.env
        required: false
    environment:
      HEALTH_PROBE_TIMEOUT_MS: ${HEALTH_PROBE_TIMEOUT_MS:-2000}
      HEALTH_PROBE_CACHE_MS: ${HEALTH_PROBE_CACHE_MS:-5000}
      SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-3000}
      SHUTDOWN_TIMEOUT_SECS: ${SHUTDOWN_TIMEOUT_SECS:-25}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NSFW_DETECTOR_URL: ${NSFW_DETECTOR_URL-http://nsfw-detector:8000}
      NSFW_THRESHOLD: ${NSFW_THRESHOLD:-0.8}
      RESERVED_USERNAMES: ${RESERVED_USERNAMES:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      MESSAGING_INTERNAL_URL: ${MESSAGING_INTERNAL_URL:-http://messaging-service:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  media-service:
    build:
      context: .
      dockerfile: docker/media-service/Dockerfile
    container_name: rift-media-service
    restart: unless-stopped
    stop_grace_period: 35s
    expose:
      - "8080"
    networks:
      - rift-network
    env_file:
      - path: env/postgres.env
        required: false
      - path: env/nats.env
        required: false
      - path: env/http.env
        required: false
      - path: env/media-service.env
        required: false
    environment:
      HEALTH_PROBE_TIMEOUT_MS: ${HEALTH_PROBE_TIMEOUT_MS:-2000}
      HEALTH_PROBE_CACHE_MS: ${HEALTH_PROBE_CACHE_MS:-5000}
      SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-3000}
      SHUTDOWN_TIMEOUT_SECS: ${SHUTDOWN_TIMEOUT_SECS:-25}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-rift-attachments}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rift}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rift-minio-secret}
      NSFW_DETECTOR_URL: ${NSFW_DETECTOR_URL-http://nsfw-detector:8000}
      NSFW_THRESHOLD: ${NSFW_THRESHOLD:-0.8}
      MESSAGING_INTERNAL_URL: ${MESSAGING_INTERNAL_URL:-http://messaging-service:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  messaging-service:
    build:
      context: .
      dockerfile: docker/messaging-service/Dockerfile
    container_name: rift-messaging-service
    restart: unless-stopped
    stop_grace_period: 35s
    expose:
      - "8080"
    networks:
      - rift-network
    env_file:
      - path: env/postgres.env
        required: false
      - path: env/nats.env
        required: false
      - path: env/http.env
        required: false
      - path: env/messaging-service.env
        required: false
    environment:
      HEALTH_PROBE_TIMEOUT_MS: ${HEALTH_PROBE_TIMEOUT_MS:-2000}
      HEALTH_PROBE_CACHE_MS: ${HEALTH_PROBE_CACHE_MS:-5000}
      SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-3000}
      SHUTDOWN_TIMEOUT_SECS: ${SHUTDOWN_TIMEOUT_SECS:-25}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-rift-attachments}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rift}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rift-minio-secret}
      MEDIA_INTERNAL_URL: ${MEDIA_INTERNAL_URL:-http://media-service:8080}
      VOICE_INTERNAL_URL: ${VOICE_INTERNAL_URL:-http://voice-service:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      livekit:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  voice-service:
    build:
      context: .
      dockerfile: docker/voice-service/Dockerfile
    container_name: rift-voice-service
    restart: unless-stopped
    stop_grace_period: 35s
    expose:
      - "8080"
    networks:
      - rift-network
    env_file:
      - path: env/postgres.env
        required: false
      - path: env/nats.env
        required: false
      - path: env/http.env
        required: false
      - path: env/voice-service.env
        required: false
    environment:
      HEALTH_PROBE_TIMEOUT_MS: ${HEALTH_PROBE_TIMEOUT_MS:-2000}
      HEALTH_PROBE_CACHE_MS: ${HEALTH_PROBE_CACHE_MS:-5000}
      SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-3000}
      SHUTDOWN_TIMEOUT_SECS: ${SHUTDOWN_TIMEOUT_SECS:-25}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MESSAGING_INTERNAL_URL: ${MESSAGING_INTERNAL_URL:-http://messaging-service:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  outbox-worker:
    build:
      context: .
      dockerfile: docker/outbox-worker/Dockerfile
    container_name: rift-outbox-worker
    restart: unless-stopped
    stop_grace_period: 35s
    networks:
      - rift-network
    environment:
      HEALTH_PROBE_TIMEOUT_MS: ${HEALTH_PROBE_TIMEOUT_MS:-2000}
      HEALTH_PROBE_CACHE_MS: ${HEALTH_PROBE_CACHE_MS:-5000}
      SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-3000}
      SHUTDOWN_TIMEOUT_SECS: ${SHUTDOWN_TIMEOUT_SECS:-25}
      OUTBOX_LIVENESS_STALE_SECS: ${OUTBOX_LIVENESS_STALE_SECS:-60}
    env_file:
      - path: env/postgres.env
        required: false
      - path: env/nats.env
        required: false
      - path: env/outbox.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8081/readyz && wget --spider -q http://127.0.0.1:8081/livez || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  notification-service:
    build:
      context: .
      dockerfile: docker/notification-service/Dockerfile
    container_name: rift-notification-service
    restart: unless-stopped
    stop_grace_period: 35s
    networks:
      - rift-network
    environment:
      HEALTH_PROBE_TIMEOUT_MS: ${HEALTH_PROBE_TIMEOUT_MS:-2000}
      HEALTH_PROBE_CACHE_MS: ${HEALTH_PROBE_CACHE_MS:-5000}
      SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-3000}
      SHUTDOWN_TIMEOUT_SECS: ${SHUTDOWN_TIMEOUT_SECS:-25}
      NOTIFICATION_LIVENESS_STALE_SECS: ${NOTIFICATION_LIVENESS_STALE_SECS:-60}
    env_file:
      - path: env/nats.env
        required: false
      - path: env/notification.env
        required: false
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8082/readyz && wget --spider -q http://127.0.0.1:8082/livez || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  realtime:
    build:
      context: .
      dockerfile: docker/realtime/Dockerfile
    container_name: rift-realtime
    restart: unless-stopped
    stop_grace_period: 35s
    expose:
      - "8083"
    networks:
      - rift-network
    env_file:
      - path: env/postgres.env
        required: false
      - path: env/nats.env
        required: false
      - path: env/http.env
        required: false
      - path: env/realtime.env
        required: false
      - path: env/websocket.env
        required: false
      - path: env/event-dispatcher.env
        required: false
    environment:
      HEALTH_PROBE_TIMEOUT_MS: ${HEALTH_PROBE_TIMEOUT_MS:-2000}
      HEALTH_PROBE_CACHE_MS: ${HEALTH_PROBE_CACHE_MS:-5000}
      SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-3000}
      SHUTDOWN_TIMEOUT_SECS: ${SHUTDOWN_TIMEOUT_SECS:-25}
      DISPATCHER_LIVENESS_STALE_SECS: ${DISPATCHER_LIVENESS_STALE_SECS:-30}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8084/readyz && wget --spider -q http://127.0.0.1:8084/livez && wget --spider -q http://127.0.0.1:8085/livez || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  livekit-pooler:
    build:
      context: .
      dockerfile: docker/livekit-pooler/Dockerfile
    container_name: rift-livekit-pooler
    restart: unless-stopped
    stop_grace_period: 35s
    networks:
      - rift-network
    environment:
      HEALTH_PROBE_TIMEOUT_MS: ${HEALTH_PROBE_TIMEOUT_MS:-2000}
      HEALTH_PROBE_CACHE_MS: ${HEALTH_PROBE_CACHE_MS:-5000}
      SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-3000}
      SHUTDOWN_TIMEOUT_SECS: ${SHUTDOWN_TIMEOUT_SECS:-25}
      LIVEKIT_POOLER_LIVENESS_STALE_SECS: ${LIVEKIT_POOLER_LIVENESS_STALE_SECS:-120}
    env_file:
      - path: env/postgres.env
        required: false
      - path: env/livekit-pooler.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8086/readyz && wget --spider -q http://127.0.0.1:8086/livez || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: rift-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "7880:7880"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - rift-network
    depends_on:
      identity-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      messaging-service:
        condition: service_healthy
      voice-service:
        condition: service_healthy
      realtime:
        condition: service_healthy
      livekit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  rift-network:
    driver: bridge
    name: rift-network

volumes:
  minio-data:
  postgres-data:
    name: rift-postgres-data
  pgadmin-data:
    name: rift-pgadmin-data
  redis-data:
    name: rift-redis-data
  nats-data:
    name: rift-nats-data
