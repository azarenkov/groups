services:
  postgres:
    image: postgres:16-alpine
    container_name: rift-postgres
    restart: unless-stopped
    env_file:
      - path: env/postgres.env
        required: false
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - rift-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: rift-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - rift-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  nats:
    image: nats:2.10-alpine
    container_name: rift-nats
    restart: unless-stopped
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    ports:
      - "4222:4222"
      - "8222:8222"
      - "6222:6222"
    volumes:
      - nats-data:/data
    networks:
      - rift-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4222"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  livekit:
    image: livekit/livekit-server:latest
    platform: linux/arm64
    container_name: rift-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    expose:
      - "7880"
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - rift-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7880 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  http:
    build:
      context: .
      dockerfile: docker/http/Dockerfile
    container_name: rift-http
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - rift-network
    env_file:
      - path: env/postgres.env
        required: false
      - path: env/nats.env
        required: false
      - path: env/http.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
      nats:
        condition: service_healthy

  outbox-worker:
    build:
      context: .
      dockerfile: docker/outbox-worker/Dockerfile
    container_name: rift-outbox-worker
    restart: unless-stopped
    networks:
      - rift-network
    env_file:
      - path: env/postgres.env
        required: false
      - path: env/nats.env
        required: false
      - path: env/outbox.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: docker/notification-service/Dockerfile
    container_name: rift-notification-service
    restart: unless-stopped
    networks:
      - rift-network
    env_file:
      - path: env/nats.env
        required: false
      - path: env/notification.env
        required: false
    depends_on:
      nats:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: rift-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "7880:7880"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - rift-network
    depends_on:
      http:
        condition: service_started
      livekit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  rift-network:
    driver: bridge
    name: rift-network

volumes:
  postgres-data:
    name: rift-postgres-data
  pgadmin-data:
    name: rift-pgadmin-data
  redis-data:
    name: rift-redis-data
  nats-data:
    name: rift-nats-data
