services:
  postgres:
    image: postgres:16-alpine
    container_name: rift-postgres
    restart: unless-stopped
    env_file:
      - path: env/postgres.env
        required: false
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - rift-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: rift-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - rift-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  nats:
    image: nats:2.10-alpine
    container_name: rift-nats
    restart: unless-stopped
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    ports:
      - "4222:4222"
      - "8222:8222"
      - "6222:6222"
    volumes:
      - nats-data:/data
    networks:
      - rift-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4222"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  livekit:
    image: livekit/livekit-server:latest
    platform: linux/arm64
    container_name: rift-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    expose:
      - "7880"
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./docker/livekit/livekit.yaml:/etc/livekit.yaml:ro
    env_file:
      - path: env/livekit.env
        required: false
    networks:
      - rift-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7880 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  minio:
    image: minio/minio:latest
    container_name: rift-minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rift}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rift-minio-secret}
    expose:
      - "9000"
    volumes:
      - minio-data:/data
    networks:
      - rift-network
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nsfw-detector:
    build:
      context: .
      dockerfile: docker/nsfw-detector/Dockerfile
    container_name: rift-nsfw-detector
    restart: unless-stopped
    environment:
      TEXT_TOXICITY_THRESHOLD: ${TEXT_TOXICITY_THRESHOLD:-0.8}
    expose:
      - "8000"
    networks:
      - rift-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  http:
    build:
      context: .
      dockerfile: docker/http/Dockerfile
    container_name: rift-http
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - rift-network
    env_file:
      - path: env/postgres.env
        required: false
      - path: env/nats.env
        required: false
      - path: env/http.env
        required: false
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-rift-attachments}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rift}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rift-minio-secret}
      NSFW_DETECTOR_URL: ${NSFW_DETECTOR_URL-http://nsfw-detector:8000}
      NSFW_THRESHOLD: ${NSFW_THRESHOLD:-0.8}
      RESERVED_USERNAMES: ${RESERVED_USERNAMES:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  outbox-worker:
    build:
      context: .
      dockerfile: docker/outbox-worker/Dockerfile
    container_name: rift-outbox-worker
    restart: unless-stopped
    networks:
      - rift-network
    env_file:
      - path: env/postgres.env
        required: false
      - path: env/nats.env
        required: false
      - path: env/outbox.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8081/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  notification-service:
    build:
      context: .
      dockerfile: docker/notification-service/Dockerfile
    container_name: rift-notification-service
    restart: unless-stopped
    networks:
      - rift-network
    env_file:
      - path: env/nats.env
        required: false
      - path: env/notification.env
        required: false
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8082/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  websocket:
    build:
      context: .
      dockerfile: docker/websocket/Dockerfile
    container_name: rift-websocket
    restart: unless-stopped
    expose:
      - "8083"
    networks:
      - rift-network
    env_file:
      - path: env/postgres.env
        required: false
      - path: env/nats.env
        required: false
      - path: env/http.env
        required: false
      - path: env/websocket.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8084/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  event-dispatcher:
    build:
      context: .
      dockerfile: docker/event-dispatcher/Dockerfile
    container_name: rift-event-dispatcher
    restart: unless-stopped
    networks:
      - rift-network
    env_file:
      - path: env/postgres.env
        required: false
      - path: env/nats.env
        required: false
      - path: env/event-dispatcher.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8085/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  livekit-pooler:
    build:
      context: .
      dockerfile: docker/livekit-pooler/Dockerfile
    container_name: rift-livekit-pooler
    restart: unless-stopped
    networks:
      - rift-network
    env_file:
      - path: env/postgres.env
        required: false
      - path: env/livekit-pooler.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8086/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: rift-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "7880:7880"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - rift-network
    depends_on:
      http:
        condition: service_healthy
      livekit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  rift-network:
    driver: bridge
    name: rift-network

volumes:
  minio-data:
  postgres-data:
    name: rift-postgres-data
  pgadmin-data:
    name: rift-pgadmin-data
  redis-data:
    name: rift-redis-data
  nats-data:
    name: rift-nats-data
