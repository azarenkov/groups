worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 16m;
    client_body_timeout 30s;
    client_header_timeout 10s;
    send_timeout 30s;
    large_client_header_buffers 4 8k;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

        limit_conn perip 20;

        if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS|PATCH)$) {
            return 405;
        }

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;

        location ~ /\.(env|git|htaccess|svn|DS_Store) {
            deny all;
            access_log off;
        }
        location ~ \.(bak|swp|sql|backup|old|orig|save)$ {
            deny all;
            access_log off;
        }
        location ~ /(wp-admin|wp-login|admin\.php|phpmyadmin|xmlrpc\.php) {
            deny all;
            access_log off;
        }

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /ws {
            set $upstream_ws http://realtime:8083;
            proxy_pass $upstream_ws;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        location = /presence {
            set $upstream_ws http://realtime:8083;
            proxy_pass $upstream_ws;
        }

        location ~ ^/api/v1/auth/(login|register|refresh|google(/complete)?)$ {
            limit_req zone=api burst=60 nodelay;
            limit_req zone=auth burst=5 nodelay;
            set $upstream_identity http://identity-service:8080;
            proxy_pass $upstream_identity;
        }

        location /api/v1/auth/ {
            limit_req zone=api burst=60 nodelay;
            set $upstream_identity http://identity-service:8080;
            proxy_pass $upstream_identity;
        }

        location = /api/v1/users/me {
            limit_req zone=api burst=60 nodelay;
            set $upstream_identity http://identity-service:8080;
            proxy_pass $upstream_identity;
        }

        location = /api/v1/users/search {
            limit_req zone=api burst=60 nodelay;
            set $upstream_identity http://identity-service:8080;
            proxy_pass $upstream_identity;
        }

        location = /api/v1/users/me/locale {
            limit_req zone=api burst=60 nodelay;
            set $upstream_identity http://identity-service:8080;
            proxy_pass $upstream_identity;
        }

        location = /api/v1/users/me/name {
            limit_req zone=api burst=60 nodelay;
            set $upstream_identity http://identity-service:8080;
            proxy_pass $upstream_identity;
        }

        location ~ ^/api/v1/users/[^/]+/avatar$ {
            limit_req zone=api burst=60 nodelay;
            set $upstream_media http://media-service:8080;
            proxy_pass $upstream_media;
        }

        location ~ ^/api/v1/servers/[^/]+/logo$ {
            limit_req zone=api burst=60 nodelay;
            set $upstream_media http://media-service:8080;
            proxy_pass $upstream_media;
        }

        location /api/v1/attachments {
            limit_req zone=api burst=60 nodelay;
            set $upstream_media http://media-service:8080;
            proxy_pass $upstream_media;
        }

        location /api/v1/calls {
            limit_req zone=api burst=60 nodelay;
            set $upstream_voice http://voice-service:8080;
            proxy_pass $upstream_voice;
        }

        location /api/webhook/ {
            limit_req zone=api burst=60 nodelay;
            set $upstream_voice http://voice-service:8080;
            proxy_pass $upstream_voice;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            set $upstream_messaging http://messaging-service:8080;
            proxy_pass $upstream_messaging;
        }

        location / {
            set $upstream_messaging http://messaging-service:8080;
            proxy_pass $upstream_messaging;
        }
    }

    server {
        listen 7880 default_server;
        server_name _;

        limit_conn perip 20;

        location / {
            set $upstream_livekit http://livekit:7880;
            proxy_pass $upstream_livekit;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }
    }
}
