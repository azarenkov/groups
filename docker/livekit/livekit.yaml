port: 7880
bind_addresses:
  - "0.0.0.0"

webhook:
  api_key: rift-server
  urls:
    - http://http:8080/api/webhook/livekit

room:
  auto_create: false
  empty_timeout: 300
  max_participants: 100

rtc:
  port_range_start: 50000
  port_range_end: 50100
  tcp_port: 7881
  use_external_ip: false
  node_ip: 127.0.0.1

logging:
  level: info
