[package]
name = "infrastructure-common"
version = "0.1.0"
edition = "2024"

[dependencies]
domain = { workspace = true }
ports = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-log = { workspace = true }
envy = { workspace = true }
dotenv = { workspace = true }
futures = { workspace = true }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "uuid"] }
bcrypt = "0.18"
livekit-api = "0.4.14"
livekit-protocol = "0.7.1"
async-nats = { workspace = true }
rust-s3 = { workspace = true }
tokio = { workspace = true, features = ["net", "time"] }
tokio-util = { workspace = true }
bytes = "1"
lettre = "0.11.21"
urlencoding = "2.1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "uuid", "migrate"] }
