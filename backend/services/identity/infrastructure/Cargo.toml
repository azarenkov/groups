[package]
name = "identity-infrastructure"
version = "0.1.0"
edition = "2024"

[dependencies]
redis = { workspace = true }
api-common = { workspace = true }
identity = { workspace = true }
contracts = { workspace = true }
domain = { workspace = true }
ports = { workspace = true }
identity-domain = { workspace = true }
infrastructure-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "uuid"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = { workspace = true }
bcrypt = "0.18"
envy = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2.6"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
