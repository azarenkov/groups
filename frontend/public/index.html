<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0d0f" />
    <meta name="description" content="Rift — a calmer place to talk with your people." />
    <title>Rift</title>
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/icons/rift-icon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="64x64" href="%PUBLIC_URL%/icons/rift-icon-64.png?v=2" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/rift-icon-256.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { height: 100%; }
      html.dark { background: #0d0d0f; color: #f5f5f7; }
      html:not(.dark) { background: #f5f5f7; color: #1d1d1f; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: inherit;
        color: inherit;
        overflow: hidden;
      }
      #root { width: 100vw; height: 100vh; overflow: hidden; }

      .loading-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: inherit;
      }
      .loading-screen .spinner {
        width: 28px;
        height: 28px;
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-top-color: #0a84ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <script src="%PUBLIC_URL%/config.js"></script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="loading-screen">
        <div class="spinner"></div>
      </div>
    </div>
  </body>
</html>
