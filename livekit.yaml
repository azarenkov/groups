port: 7880
bind_addresses:
  - ""

rtc:
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
  # Для локальной разработки
  # tcp_port: 7882
  # ice_servers:
  #   - urls:
  #       - stun:stun.l.google.com:19302

redis:
  address: redis:6379

keys:
  devkey: secret

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 100
  departure_timeout: 20

logging:
  level: debug
  sample: false
  json: false

